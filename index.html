<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caixa - Açaíteria</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:white;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:22px} header span{font-size:14px;color:#d1d5db}
.wrap{max-width:1100px;margin:22px auto;padding:0 14px;display:grid;grid-template-columns:1fr 1.15fr;gap:18px}
.card{background:white;border-radius:14px;padding:20px;box-shadow:0 2px 10px #00000012}
h2{margin:0 0 16px;font-size:19px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{font-size:13px;font-weight:bold;color:#374151;display:block;margin-bottom:6px}
select,input{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:9px;font-size:16px;background:white}
button{border:0;border-radius:9px;padding:13px 15px;font-weight:bold;cursor:pointer;font-size:15px}
.primary{background:#111827;color:white;width:100%;margin-top:14px}.primary:hover{background:#1f2937}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.quick button{background:#eef2ff;color:#312e81}
.total{font-size:30px;font-weight:800;text-align:right;margin:14px 0}
.cart{min-height:180px;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden}
.item{display:grid;grid-template-columns:1fr 70px 95px 32px;gap:8px;align-items:center;padding:11px 12px;border-bottom:1px solid #eee}
.item:last-child{border-bottom:0}.muted{color:#6b7280;font-size:13px}
.remove{background:#fee2e2;color:#991b1b;padding:7px}
.payment{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.payment button{background:#f3f4f6}.payment button.active{background:#111827;color:white}
.final{background:#16a34a;color:white;width:100%;margin-top:12px;font-size:17px}
.secondary{background:#e5e7eb;color:#111827}
.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.stat{background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:12px}.stat b{display:block;font-size:19px;margin-top:4px}
.history{max-height:260px;overflow:auto}.sale{padding:10px 0;border-bottom:1px solid #eee}
.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1}
.empty{padding:35px;text-align:center;color:#9ca3af}
@media(max-width:800px){.wrap{grid-template-columns:1fr}.payment{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}

/* iPhone / PWA enhancements */
html { background:#f3f4f6; }
body { -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent; padding-bottom:env(safe-area-inset-bottom); }
header { padding-top:calc(16px + env(safe-area-inset-top)); }
button, select, input { -webkit-appearance:none; appearance:none; touch-action:manipulation; }
button { min-height:44px; }
input, select { min-height:48px; }
@media(max-width:800px){
  body { font-size:16px; }
  header { position:sticky; top:0; z-index:10; }
  .wrap { margin:10px auto; padding:0 10px; gap:10px; }
  .card { border-radius:12px; padding:15px; }
  .total { font-size:28px; }
  .quick { grid-template-columns:1fr 1fr; }
  .quick button { min-height:52px; }
  .payment button { min-height:52px; }
  .final { min-height:54px; }
  .secondary { min-height:48px; }
}

</style>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Caixa Açaíteria">
<link rel="apple-touch-icon" href="icon-180.png">
</head>
<body>
<header><h1>🧾 CAIXA</h1><span id="clock"></span></header>

<div class="wrap">
<section class="card">
<h2>Nova venda</h2>
<div class="grid">
<div>
<label>Produto</label>
<select id="product"></select>
</div>
<div>
<label>Preço unitário (R$)</label>
<input id="price" type="number" step="0.01" min="0">
</div>
<div>
<label>Quantidade</label>
<input id="qty" type="number" step="1" min="1" value="1">
</div>
</div>

<div class="quick" id="quick"></div>
<button class="primary" onclick="addItem()">＋ ADICIONAR À VENDA</button>
<p class="muted">O preço pode ser alterado antes de adicionar. Isso permite vender o mesmo produto por valores diferentes.</p>
</section>

<section class="card">
<h2>Venda atual</h2>
<div id="cart" class="cart"><div class="empty">Nenhum item adicionado</div></div>
<div class="total">R$ <span id="total">0,00</span></div>

<label>Forma de pagamento</label>
<div class="payment">
<button data-pay="Dinheiro" onclick="setPay(this)">💵 Dinheiro</button>
<button data-pay="Pix" onclick="setPay(this)">📱 Pix</button>
<button data-pay="Débito" onclick="setPay(this)">💳 Débito</button>
<button data-pay="Crédito" onclick="setPay(this)">💳 Crédito</button>
</div>
<button class="final" onclick="finishSale()">✓ FINALIZAR VENDA</button>
<button class="secondary" style="width:100%;margin-top:8px" onclick="clearCart()">Limpar venda</button>
</section>

<section class="card">
<h2>Resumo de hoje</h2>
<div class="summary">
<div class="stat">Faturamento<b>R$ <span id="sTotal">0,00</span></b></div>
<div class="stat">Vendas<b><span id="sSales">0</span></b></div>
<div class="stat">Dinheiro<b>R$ <span id="sDin">0,00</span></b></div>
<div class="stat">Pix<b>R$ <span id="sPix">0,00</span></b></div>
<div class="stat">Débito<b>R$ <span id="sDeb">0,00</span></b></div>
<div class="stat">Crédito<b>R$ <span id="sCred">0,00</span></b></div>
</div>
<div class="actions"><button class="secondary" onclick="exportCSV()">Exportar vendas</button><button class="secondary" onclick="resetDay()">Zerar histórico</button></div>
</section>

<section class="card">
<h2>Últimas vendas</h2>
<div id="history" class="history"></div>
</section>
</div>

<script>
const products = [
  {name:"Açaí 1 litro", price:18},
  {name:"Açaí 500 ml", price:15},
  {name:"Tapioca R$ 8", price:8},
  {name:"Tapioca R$ 15", price:15},
  {name:"Farinha", price:10}
];

let cart=[], payment="Pix";
let sales=JSON.parse(localStorage.getItem("caixa_sales")||"[]");

const money=n=>Number(n).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});

function init(){
  const sel=document.getElementById("product");
  products.forEach((p,i)=>{let o=document.createElement("option");o.value=i;o.textContent=p.name;sel.appendChild(o)});
  sel.onchange=updatePrice;
  updatePrice(); renderQuick(); renderCart(); renderSummary(); renderHistory(); setPay(document.querySelector('[data-pay="Pix"]'));
}
function updatePrice(){document.getElementById("price").value=products[document.getElementById("product").value].price}
function renderQuick(){
  const q=document.getElementById("quick");
  products.forEach((p,i)=>{let b=document.createElement("button");b.textContent=p.name+" • R$ "+money(p.price);b.onclick=()=>{document.getElementById("product").value=i;updatePrice()};q.appendChild(b)})
}
function addItem(){
  const p=products[document.getElementById("product").value], price=parseFloat(document.getElementById("price").value), qty=parseInt(document.getElementById("qty").value);
  if(!price || price<0 || !qty || qty<1)return alert("Confira preço e quantidade.");
  cart.push({name:p.name,price,qty,total:price*qty}); renderCart();
  document.getElementById("qty").value=1;
}
function renderCart(){
  const c=document.getElementById("cart");
  if(!cart.length){c.innerHTML='<div class="empty">Nenhum item adicionado</div>';document.getElementById("total").textContent="0,00";return}
  c.innerHTML=cart.map((x,i)=>`<div class="item"><div><b>${x.name}</b><div class="muted">${x.qty} x R$ ${money(x.price)}</div></div><span>${x.qty}x</span><b>R$ ${money(x.total)}</b><button class="remove" onclick="removeItem(${i})">×</button></div>`).join("");
  document.getElementById("total").textContent=money(cart.reduce((s,x)=>s+x.total,0));
}
function removeItem(i){cart.splice(i,1);renderCart()}
function clearCart(){cart=[];renderCart()}
function setPay(btn){payment=btn.dataset.pay;document.querySelectorAll(".payment button").forEach(b=>b.classList.remove("active"));btn.classList.add("active")}
function finishSale(){
  if(!cart.length)return alert("Adicione pelo menos um item.");
  const total=cart.reduce((s,x)=>s+x.total,0);
  sales.unshift({date:new Date().toISOString(),items:[...cart],payment,total});
  localStorage.setItem("caixa_sales",JSON.stringify(sales));
  alert("Venda registrada: R$ "+money(total)+" • "+payment);
  cart=[];renderCart();renderSummary();renderHistory();
}
function renderSummary(){
  const today=new Date().toLocaleDateString("pt-BR");
  const todaySales=sales.filter(s=>new Date(s.date).toLocaleDateString("pt-BR")===today);
  const sum=k=>todaySales.filter(s=>s.payment===k).reduce((a,s)=>a+s.total,0);
  document.getElementById("sTotal").textContent=money(todaySales.reduce((a,s)=>a+s.total,0));
  document.getElementById("sSales").textContent=todaySales.length;
  document.getElementById("sDin").textContent=money(sum("Dinheiro"));
  document.getElementById("sPix").textContent=money(sum("Pix"));
  document.getElementById("sDeb").textContent=money(sum("Débito"));
  document.getElementById("sCred").textContent=money(sum("Crédito"));
}
function renderHistory(){
  const h=document.getElementById("history");
  if(!sales.length){h.innerHTML='<div class="empty">Nenhuma venda registrada</div>';return}
  h.innerHTML=sales.slice(0,30).map(s=>`<div class="sale"><b>R$ ${money(s.total)}</b> • ${s.payment}<div class="muted">${new Date(s.date).toLocaleString("pt-BR")} — ${s.items.map(i=>i.qty+"x "+i.name).join(", ")}</div></div>`).join("");
}
function resetDay(){
  if(confirm("Isso apaga todo o histórico salvo neste computador. Continuar?")){sales=[];localStorage.removeItem("caixa_sales");renderSummary();renderHistory()}
}
function exportCSV(){
  if(!sales.length)return alert("Não há vendas para exportar.");
  let rows=[["Data","Produtos","Total","Pagamento"]];
  sales.slice().reverse().forEach(s=>rows.push([new Date(s.date).toLocaleString("pt-BR"),s.items.map(i=>`${i.qty}x ${i.name} (R$ ${money(i.price)})`).join(" | "),money(s.total),s.payment]));
  const csv=rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(";")).join("\\n");
  const blob=new Blob(["\\ufeff"+csv],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="vendas.csv";a.click();URL.revokeObjectURL(a.href);
}
setInterval(()=>document.getElementById("clock").textContent=new Date().toLocaleString("pt-BR"),1000);
init();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
</body>

</html>
